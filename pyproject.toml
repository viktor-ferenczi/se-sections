[project]
name = "se-sections-tests"
version = "0.1.0"
description = "In-game tests of the Sections plugin, driven through the Remote plugin"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The dedicated server tests run on their own: uv run pytest tests/ds
norecursedirs = ["ds", "physics-policy"]
# The other test_*.py files are scripts, run one by one (tests/README.md)
python_files = ["test_references.py", "test_rebuild.py", "test_reference_world.py", "test_multiplayer.py"]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]
